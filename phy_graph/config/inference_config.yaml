# phy_graph inference config

# === Image processing parameters ===
image:
  # Minimum crop size after crop (pixels), images smaller than this will be skipped
  min_crop_size: 48
  # Bounding box expansion factor (0.3 = 30% padding)
  padding_factor: 0.5
  # Minimum acceptable image score (0-100)
  score_threshold: 65.0
  # High quality threshold, inference will be triggered when this score is reached
  high_quality_threshold: 70.0
  # Projection mode: "mesh_vertices" (original method, accurate but slow) or "hydra_bbox" (fast, depends on Hydra bbox)
  projection_mode: "hydra_bbox"
  # Draw a red bbox on the cropped image sent to VLM so the model knows which object to analyze (helps when crop contains multiple objects)
  draw_bbox_for_vlm: true

# === Keyframe database parameters ===
keyframe:
  # Maximum number of frames to retain in memory
  max_memory_frames: 2000
  # Minimum translation threshold for keyframes (meters)
  min_translation: 0.2
  # Minimum rotation threshold for keyframes (radians)
  min_rotation: 0.1
  # Minimum time interval between keyframes (seconds)
  min_time_interval: 0.2
  # Image search time window (seconds)
  time_window: 8.0
  # RGB frame skip ratio: process every N frames (15Hz input: 5=3Hz, 10=1.5Hz)
  frame_skip: 5

# === Inference queue parameters ===
inference:
  # Number of parallel workers (1 = serial, recommended to start from 1)
  num_workers: 1
  # Maximum queue length
  max_queue_size: 100
  # Maximum defer count (after which new observations are suppressed)
  max_defer_count: 5
  # Wait timeout (seconds), after which current best image is forced to be used
  wait_timeout: 5.0
  # Minimum acceptable score for forced enqueue (to prevent black screens/low quality images)
  min_acceptable_score: 50.0
  # Main loop frequency (Hz)
  loop_rate: 0.5

# === VLM 服务参数 ===
vlm:
  # Model name
  model_name: "openai/gpt-4o-mini"
  # Maximum number of API retries
  max_retries: 3
  # API timeout (seconds)
  timeout_seconds: 30
  # Dry-run mode: true skips actual API calls, returns simulated results
  dry_run: false

# === Object maturity parameters ===
object_maturity:
  # Minimum "maturity" time for objects (seconds), waiting for Hydra bbox to stabilize
  min_age_seconds: 1.0
  # Whether to enable maturity detection
  enable: false

# === Occlusion detection parameters ===
occlusion:
  # Whether to enable occlusion detection (requires depth map)
  enable: true
  # Depth comparison threshold (meters), object depth > depth map depth + threshold is considered occluded
  depth_threshold: 0.1
  # Number of occlusion detection sample points (from bbox/mesh, reducing computation)
  sample_points: 50
  # Maximum occlusion score (full score when not occluded)
  max_score: 35

# === Distance-based scoring parameters ===
distance:
  # Ideal distance range for observation (meters)
  ideal_min: 0.6  # Minimum ideal distance
  ideal_max: 4.0  # Maximum ideal distance
  # Maximum effective distance (beyond this, score approaches zero)
  max_distance: 8.0
  # Maximum distance score (points)
  max_score: 20

# === Debug parameters ===
debug:
  # Whether to save images for inference
  save_images: true
  # Detailed log output
  verbose: false
